server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    location ^~ /api/public/ {
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $public_backend http://public-backend:8000;
        proxy_pass $public_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location /status/ { try_files /public.html =404; }
    location / { return 404; }
}
