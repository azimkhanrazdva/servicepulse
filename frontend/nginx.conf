server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        # Resolve again after Compose replaces the backend container/IP.
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
