name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: servicepulse
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: servicepulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U servicepulse -d servicepulse_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://servicepulse:local-development-only@localhost/servicepulse_test
      TEST_DATABASE_URL: postgresql+asyncpg://servicepulse:local-development-only@localhost/servicepulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e ./backend
      - run: ruff check backend
      - run: ruff format --check backend
      - run: cd backend && python tests/run.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
